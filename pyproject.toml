[project]
name = "mandala"
version = "0.1.0"
description = "Project Mandala — a 90-day multi-agent curriculum, built on free tiers only"
requires-python = "==3.12.*"
dependencies = [
    "openai==3.3.1",
    "python-dotenv==1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mandala"]

[tool.uv]
# This repo lives inside a OneDrive-synced folder, and OneDrive's filesystem refuses hardlinks
# ("os error 396: incompatible hardlinks"). uv hardlinks from its cache into .venv by default,
# so every `uv run` would fail. Copying is slower and correct. Day 0 part 1.3 explains this.
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py312"
# legacy/ is the archived v1.1.0 repo (see legacy/README.md) - kept verbatim, never linted.
# days/*/lab is the learner's own scratch code; it is graded by reading, not by ruff.
extend-exclude = ["legacy", "days/*/lab"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
# Lessons are teaching text, not source. ruff 0.16 formats Python blocks inside Markdown,
# which would rewrite every aligned-comment listing in days/*/LESSON.md. Format real .py
# files only; the lessons stay exactly as written. (Day 1 finding — see CHANGELOG_PLAN.md.)
exclude = ["**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits a real provider; costs free-tier quota; excluded from the default run",
    "cassette: replays a recorded response; free and offline",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-recording==0.13.4",
    "ruff==0.16.3",
    "vcrpy==8.3.0",
]
