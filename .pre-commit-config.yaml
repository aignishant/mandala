repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (offline tier only)
        # -m "not live" keeps the hook free (Principle 5); exit code 5 means pytest
        # collected no tests, which is the honest state until the first lab writes one.
        entry: bash -c 'uv run python -m pytest -q -m "not live" || [ $? -eq 5 ]'
        language: system
        pass_filenames: false
        always_run: true

      - id: no-env-staged
        name: refuse to commit .env
        entry: bash -c '! git diff --cached --name-only | grep -qx "\.env"'
        language: system
        pass_filenames: false
        always_run: true
