repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (unit + cassette, offline)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true

      - id: no-env-staged
        name: refuse to commit .env
        entry: bash -c '! git diff --cached --name-only | grep -qx "\.env"'
        language: system
        pass_filenames: false
        always_run: true
